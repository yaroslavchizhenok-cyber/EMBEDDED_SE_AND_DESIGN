# Drone 7 of the swarm: a sensor.  Open THIS folder in its own VS Code
# window, then F1 -> "Wokwi: Start Simulator".  Every drone flies the same
# ../Main.hex (build it with ../build.bat).  diagram.json's straps make this
# board drone 7, a sensor: PB0/PA7/PA15 to GND are ID bits 0/1/2,
# PB1/PB2 to GND are TYPE bits 0/1 (0 mapper, 1 sensor, 2 relay).
[wokwi]
version = 1
firmware = '../Main.hex'
elf = '../Main.elf'
# This drone's radio: the station's air reaches it here.
rfc2217ServerPort = 4007
gdbServerPort = 3347
